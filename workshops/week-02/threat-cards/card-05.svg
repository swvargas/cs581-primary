<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Threat Card 05: Maroochy Water Breach Insider</title>
  <desc id="desc">Insider case threat card showing an unmanned radio transmitter and pump symbols. No person is depicted.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071622"/><stop offset="1" stop-color="#0b2b3d"/></linearGradient><style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.small{font-size:22px}.body{font-size:25px}.muted{fill:#bfd8e5}.accent{fill:#7dd3fc}.rule{stroke:#0ea5e9;stroke-width:2}</style></defs>
  <rect width="900" height="1200" rx="34" fill="url(#bg)"/><rect x="24" y="24" width="852" height="1152" rx="26" fill="none" stroke="#0ea5e9" stroke-width="4"/>
  <text x="62" y="78" class="sans accent small" letter-spacing="4">THREAT FIELD GUIDE • 05</text><text x="62" y="137" class="serif" font-size="42" font-weight="bold" fill="#f0f9ff">MAROOCHY WATER BREACH</text><text x="62" y="181" class="serif" font-size="42" font-weight="bold" fill="#f0f9ff">INSIDER</text><line x1="62" y1="220" x2="838" y2="220" class="rule"/>
  <text x="62" y="264" class="sans accent small" font-weight="bold">TIER / TYPE</text><text x="254" y="264" class="sans body" fill="white">INSIDER</text>
  <g transform="translate(450 475)" fill="none" stroke="#bae6fd"><rect x="-300" y="-95" width="190" height="240" rx="20" fill="#0c2230" stroke-width="9"/><path d="M-205-95v-130M-235-225h60M-258 15h106M-245 58h80" stroke-width="10"/><circle cx="-205" cy="105" r="18" fill="#fb7185" stroke="none"/><path d="M-95-115q130 115 0 230M-48-168q230 168 0 336" stroke="#38bdf8" stroke-width="11"/><g transform="translate(220 50)" stroke-width="10"><circle r="90"/><path d="M-90 0h-75v110h330V0H90M-38-66L42 0-38 66z" fill="#0c4a6e"/></g><path d="M-80 175q165-78 330 0" stroke="#fb7185" stroke-width="9" stroke-dasharray="18 12"/></g>
  <rect x="52" y="690" width="796" height="172" rx="18" fill="#0c354b" stroke="#0ea5e9"/><text x="76" y="730" class="sans accent small" font-weight="bold">SIGNATURE TTP</text><text x="76" y="770" class="sans" font-size="29" fill="white">Unauthorized Message: Command Message</text><text x="76" y="817" class="sans" font-size="34" font-weight="bold" fill="#7dd3fc">MITRE ICS T1692.001</text>
  <text x="62" y="900" class="sans accent small" font-weight="bold">STAT LINE</text><text x="62" y="934" class="sans" font-size="22" fill="white"><tspan x="62">Used a two-way radio and engineering knowledge to send false data</tspan><tspan x="62" dy="29">and instructions to pumping stations and the central computer.</tspan></text>
  <text x="62" y="1026" class="sans accent small" font-weight="bold">PROVENANCE</text><text x="62" y="1059" class="sans" font-size="18" fill="#bfd8e5">MITRE ATT&amp;CK C0020, T1692.001; Marshall Abrams, 2008.</text>
  <text x="62" y="1110" class="sans accent small" font-weight="bold">LIMITS</text><text x="62" y="1141" class="sans" font-size="17" fill="#bae6fd">This case does not establish the same access, motive, or architecture in RMS.</text>
</svg>
