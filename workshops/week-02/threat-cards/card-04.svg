<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Threat Card 04: DarkSide</title>
  <desc id="desc">Criminal threat card showing a locked pipeline valve and interrupted currency waveform. No person is depicted.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#140e12"/><stop offset="1" stop-color="#2a1018"/></linearGradient><style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.small{font-size:22px}.body{font-size:25px}.muted{fill:#dfc4cc}.accent{fill:#fb7185}.rule{stroke:#e11d48;stroke-width:2}</style></defs>
  <rect width="900" height="1200" rx="34" fill="url(#bg)"/><rect x="24" y="24" width="852" height="1152" rx="26" fill="none" stroke="#e11d48" stroke-width="4"/>
  <text x="62" y="78" class="sans accent small" letter-spacing="4">THREAT FIELD GUIDE • 04</text><text x="62" y="148" class="serif" font-size="62" font-weight="bold" fill="#fff1f2">DARKSIDE</text><text x="62" y="190" class="sans muted small">Ransomware-as-a-service group</text><line x1="62" y1="220" x2="838" y2="220" class="rule"/>
  <text x="62" y="264" class="sans accent small" font-weight="bold">TIER / TYPE</text><text x="254" y="264" class="sans body" fill="white">CRIMINAL</text>
  <g transform="translate(450 470)" fill="none"><path d="M-300 75h600" stroke="#9f1239" stroke-width="72"/><circle r="135" fill="#281016" stroke="#fb7185" stroke-width="14"/><circle r="46" stroke="#fecdd3" stroke-width="14"/><path d="M0-135V135M-135 0H135M-96-96L96 96M96-96L-96 96" stroke="#fecdd3" stroke-width="12"/><rect x="65" y="20" width="138" height="135" rx="18" fill="#3f111d" stroke="#fda4af" stroke-width="10"/><path d="M96 20v-48a38 38 0 0176 0v48" stroke="#fda4af" stroke-width="10"/><path d="M-320-155h105l35-40 42 80 52-82 48 43h75M205-155h115" stroke="#4ade80" stroke-width="10"/></g>
  <rect x="52" y="690" width="796" height="172" rx="18" fill="#3f111d" stroke="#e11d48"/><text x="76" y="730" class="sans accent small" font-weight="bold">SIGNATURE TTP</text><text x="76" y="770" class="sans" font-size="31" fill="white">Loss of Productivity and Revenue</text><text x="76" y="817" class="sans" font-size="34" font-weight="bold" fill="#fb7185">MITRE ICS T0828</text>
  <text x="62" y="900" class="sans accent small" font-weight="bold">STAT LINE</text><text x="62" y="934" class="sans" font-size="22" fill="white"><tspan x="62">Ransomware affected Colonial Pipeline's IT network and led to a</tspan><tspan x="62" dy="29">precautionary shutdown; CISA reported no indication OT was affected.</tspan></text>
  <text x="62" y="1026" class="sans accent small" font-weight="bold">PROVENANCE</text><text x="62" y="1059" class="sans" font-size="20" fill="#dfc4cc">CISA/FBI AA21-131A; FBI, May 10, 2021; MITRE ICS T0828.</text>
  <text x="62" y="1110" class="sans accent small" font-weight="bold">LIMITS</text><text x="62" y="1141" class="sans" font-size="18" fill="#fecdd3">No evidence proves DarkSide reached OT or targeted an RMS.</text>
</svg>
