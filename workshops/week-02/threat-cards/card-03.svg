<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Threat Card 03: CyberAv3ngers</title>
  <desc id="desc">Hacktivist persona threat card showing a cracked PLC and key. No person is depicted.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#190c27"/><stop offset="1" stop-color="#251038"/></linearGradient><style>.sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.small{font-size:22px}.body{font-size:25px}.muted{fill:#d8c4ea}.accent{fill:#d8b4fe}.rule{stroke:#a855f7;stroke-width:2}</style></defs>
  <rect width="900" height="1200" rx="34" fill="url(#bg)"/><rect x="24" y="24" width="852" height="1152" rx="26" fill="none" stroke="#a855f7" stroke-width="4"/>
  <text x="62" y="78" class="sans accent small" letter-spacing="4">THREAT FIELD GUIDE • 03</text><text x="62" y="148" class="serif" font-size="56" font-weight="bold" fill="#faf5ff">CYBERAV3NGERS</text><text x="62" y="190" class="sans muted small">CyberAveng3rs • Cyber Avengers</text><line x1="62" y1="220" x2="838" y2="220" class="rule"/>
  <text x="62" y="264" class="sans accent small" font-weight="bold">TIER / TYPE</text><text x="254" y="264" class="sans body" fill="white">HACKTIVIST PERSONA</text>
  <g transform="translate(450 475)"><rect x="-205" y="-150" width="410" height="300" rx="24" fill="#111827" stroke="#c084fc" stroke-width="9"/><rect x="-160" y="-105" width="250" height="160" fill="#32184f" stroke="#e9d5ff" stroke-width="5"/><path d="M-40-104L-5-38-50 4 5 54-20 104" fill="none" stroke="#fb7185" stroke-width="9"/><path d="M35-75L-5 5h55l-32 82" fill="none" stroke="#facc15" stroke-width="18"/><g transform="translate(125 68)" fill="none" stroke="#e9d5ff" stroke-width="14"><circle r="42"/><path d="M-32 30l-108 108m18-18 28 28m-2-50 28 28"/></g></g>
  <rect x="52" y="690" width="796" height="172" rx="18" fill="#32184f" stroke="#a855f7"/><text x="76" y="730" class="sans accent small" font-weight="bold">SIGNATURE TTP</text><text x="76" y="770" class="sans" font-size="31" fill="white">Valid Accounts</text><text x="76" y="817" class="sans" font-size="34" font-weight="bold" fill="#d8b4fe">MITRE ICS T0859</text>
  <text x="62" y="902" class="sans accent small" font-weight="bold">STAT LINE</text><text x="62" y="936" class="sans" font-size="23" fill="white"><tspan x="62">Authenticated to internet-connected Unitronics devices using</tspan><tspan x="62" dy="30">default or no passwords, then altered operation and displayed</tspan><tspan x="62" dy="30">defacement messages.</tspan></text>
  <text x="62" y="1040" class="sans accent small" font-weight="bold">PROVENANCE</text><text x="62" y="1073" class="sans" font-size="19" fill="#d8c4ea">CISA et al., AA23-335A, IRGC-Affiliated Cyber Actors Exploit PLCs.</text>
  <text x="62" y="1115" class="sans accent small" font-weight="bold">LIMITS</text><text x="62" y="1146" class="sans" font-size="17" fill="#e9d5ff">Affiliation is assessed; no source establishes RMS or nuclear targeting.</text>
</svg>
